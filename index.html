<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Tela de Início -->
        <div id="start-screen" class="overlay">
            <h1>SPACE SHOOTER</h1>
            <p class="subtitle">SELECIONE O NÍVEL</p>
            <div class="level-buttons">
                <button class="btn-level" onclick="startGame(1)">NÍVEL 1 (Ondas 1-5)</button>
                <button class="btn-level" onclick="startGame(3)">NÍVEL 2 (Ondas 3-5)</button>
                <button class="btn-level btn-boss" onclick="startGame(5)">NÍVEL 3 (BOSS)</button>
            </div>
        </div>

        <div class="ui-bar">
            <div class="hp-box">
                <div id="hp-bar"></div>
                <span id="hp-text">100%</span>
            </div>
            <span>ONDA: <span id="wave">1</span>/5</span>
            <span>SCORE: <span id="score">0</span></span>
            <span>❤️ <span id="lives">3</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <p class="controls">Controles: [WASD / Setas] Mover | [Espaço / Mouse] Atirar</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
